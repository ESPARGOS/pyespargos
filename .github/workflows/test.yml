name: Build and test

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build source distribution and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel and test dependencies
        run: python -m pip install dist/*.whl pytest scipy matplotlib PyQt6 PyQt6-Charts
      - name: Check installed library and native decoder
        working-directory: ${{ runner.temp }}
        run: python -c "import espargos; from espargos.packet_decoders import wifi; wifi([0])"
      - name: Run tests
        run: python -m pytest -q tests
