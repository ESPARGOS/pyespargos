name: Build and test

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build source distribution and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel
        shell: bash
        run: python -m pip install dist/*.whl
      - name: Check installed library and native decoder
        working-directory: ${{ runner.temp }}
        run: python -c "import espargos; from importlib.metadata import version; from espargos.packet_decoders import wifi; assert espargos.__version__ == version('pyespargos'); wifi([0])"
      - name: Install demo and test dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libva-drm2 libpulse0
          wheels=(dist/*.whl)
          python -m pip install "${wheels[0]}[demos]" pytest
      - name: Run tests
        if: runner.os == 'Linux'
        run: python -m pytest -q
