<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" role="img" aria-labelledby="title desc">
  <title id="title">Placing a direction change in a raw IQ stream</title>
  <desc id="desc">Two client writes supply 64 input samples each. The beam changes direction at 2.010 seconds, sixteen input samples into the second write.</desc>
  <rect width="780" height="240" fill="white"/>
  <g font-family="Carlito, Calibri, Arial, sans-serif" font-size="18" fill="#293135">

    <text x="18" y="38">Time from start</text>
    <g text-anchor="middle"><text x="186" y="38">2.000 s</text><text x="448" y="38">2.008 s</text><text x="526" y="38">2.010 s</text><text x="730" y="38">2.016 s</text></g>
    <text x="18" y="91" font-weight="bold">Raw IQ at 8 kSa/s</text>
    <rect x="186" y="62" width="270" height="46" fill="#edf1f1"/><rect x="460" y="62" width="270" height="46" fill="#edf1f1"/>
    <text x="321" y="91" text-anchor="middle">Write 64 samples</text><text x="615" y="91" text-anchor="middle">Write 64 samples</text>
    <text x="18" y="152" font-weight="bold">Beam direction</text>
    <rect x="186" y="122" width="340" height="46" fill="#cee8dc"/><rect x="526" y="122" width="204" height="46" fill="#cbe1f1"/>
    <text x="356" y="152" text-anchor="middle">−30°</text><text x="628" y="152" text-anchor="middle">+30°</text>
    <path d="M526 46v141" stroke="#80498a" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="18" y="212">Playback offset</text><g text-anchor="middle"><text x="186" y="212">32,000,000</text><text x="526" y="212">32,160,000</text><text x="730" y="212">32,256,000</text></g>
  </g>
</svg>
