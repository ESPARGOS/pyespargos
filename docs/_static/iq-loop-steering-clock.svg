<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" role="img" aria-labelledby="title desc">
  <title id="title">Steering one beam while a second beam stays at broadside</title>
  <desc id="desc">The moving beam points at −30°, 0° and +30° at offsets of zero, 800,000 and 1,600,000 playback samples. The pilot remains at zero degrees.</desc>
  <rect width="780" height="240" fill="white"/>
  <g font-family="Carlito, Calibri, Arial, sans-serif" font-size="18" fill="#293135">

    <text x="18" y="38">Time from start</text>
    <g text-anchor="middle"><text x="193" y="38">0 ms</text><text x="380" y="38">10 ms</text><text x="567" y="38">20 ms</text></g>
    <text x="18" y="92" font-weight="bold">Sweep beam</text>
    <rect x="193" y="62" width="187" height="46" fill="#cee8dc"/><rect x="380" y="62" width="187" height="46" fill="#cbe1f1"/><rect x="567" y="62" width="187" height="46" fill="#e6dced"/>
    <g text-anchor="middle"><text x="286" y="92">−30°</text><text x="473" y="92">0°</text><text x="660" y="92">+30°</text></g>
    <text x="18" y="152" font-weight="bold">Pilot beam</text><rect x="193" y="122" width="561" height="46" fill="#edf1f1"/><text x="473" y="152" text-anchor="middle">0° throughout</text>
    <path d="M193 46v145m187 -145v145m187 -145v145" stroke="#586771" stroke-dasharray="4 4" fill="none"/>
    <text x="18" y="213">Sample offset</text><g text-anchor="middle"><text x="193" y="213">0</text><text x="380" y="213">800,000</text><text x="567" y="213">1,600,000</text></g>
  </g>
</svg>
