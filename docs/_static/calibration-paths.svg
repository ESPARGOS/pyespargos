<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">ESPARGOS calibration signal paths</title>
<desc id="desc">Both methods first calibrate sensor receivers from the controller reference. Transmit calibration either sends sensor pilots back to the controller monitor through a bidirectional reference network, or compares reciprocal pilot exchanges between sensors.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="10" viewBox="0 0 11 10" refX="10" refY="5" orient="auto-start-reverse"><path d="M0,0 L11,5 L0,10 L2.5,5 Z" fill="#293135"/></marker></defs>
<rect width="1000" height="650" fill="white"/>
<g font-family="Carlito, Calibri, Arial, sans-serif" font-size="19" fill="#293135">
<rect x="25" y="17" width="5" height="26" fill="#37c964"/>
<text x="42" y="38" text-anchor="start" font-size="23" fill="#293135" font-weight="700">1. Receive calibration</text>
<text x="975" y="38" text-anchor="end" font-size="19" fill="#4a5550" font-weight="400">Common to both methods</text>
<rect x="45" y="76" width="200" height="70" rx="4" fill="white" stroke="#293135" stroke-width="1.5"/>
<text x="145.0" y="105.5" text-anchor="middle" font-size="19" fill="#293135" font-weight="400">Controller</text>
<text x="145.0" y="128.5" text-anchor="middle" font-size="19" fill="#293135" font-weight="400">reference generator</text>
<rect x="365" y="76" width="230" height="70" rx="4" fill="#edfbf2" stroke="#293135" stroke-width="1.5"/>
<text x="480.0" y="105.5" text-anchor="middle" font-size="19" fill="#293135" font-weight="400">REF distribution</text>
<text x="480.0" y="128.5" text-anchor="middle" font-size="19" fill="#293135" font-weight="400">modeled path delays</text>
<rect x="740" y="76" width="215" height="70" rx="4" fill="#d7f4e0" stroke="#293135" stroke-width="1.5"/>
<text x="847.5" y="105.5" text-anchor="middle" font-size="19" fill="#293135" font-weight="400">Sensor receivers</text>
<text x="847.5" y="128.5" text-anchor="middle" font-size="19" fill="#293135" font-weight="400">A, B, C, …</text>
<path d="M245,111 L355,111" fill="none" stroke="#293135" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M595,111 L730,111" fill="none" stroke="#293135" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="182" text-anchor="middle" font-size="19" fill="#4a5550" font-weight="400">Known reference paths separate receiver offsets from distribution delays.</text>
<path d="M25,211 H975 M500,234 V600" fill="none" stroke="#d0d8d4"/>
<rect x="25" y="234" width="5" height="26" fill="#37c964"/>
<text x="42" y="255" text-anchor="start" font-size="23" fill="#293135" font-weight="700">2a. Controller monitor</text>
<rect x="525" y="234" width="5" height="26" fill="#37c964"/>
<text x="542" y="255" text-anchor="start" font-size="23" fill="#293135" font-weight="700">2b. Reciprocal sensor links</text>
<rect x="40" y="342" width="180" height="90" rx="4" fill="white" stroke="#293135" stroke-width="1.5"/>
<text x="130.0" y="381.5" text-anchor="middle" font-size="19" fill="#293135" font-weight="400">Controller</text>
<text x="130.0" y="404.5" text-anchor="middle" font-size="19" fill="#293135" font-weight="400">monitor receiver</text>
<rect x="325" y="300" width="135" height="54" rx="4" fill="#d7f4e0" stroke="#293135" stroke-width="1.5"/>
<text x="392.5" y="333.0" text-anchor="middle" font-size="19" fill="#293135" font-weight="400">Sensor A</text>
<path d="M315,327 L230,358" fill="none" stroke="#293135" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="325" y="385" width="135" height="54" rx="4" fill="#d7f4e0" stroke="#293135" stroke-width="1.5"/>
<text x="392.5" y="418.0" text-anchor="middle" font-size="19" fill="#293135" font-weight="400">Sensor B</text>
<path d="M315,412 L230,387" fill="none" stroke="#293135" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="325" y="470" width="135" height="54" rx="4" fill="#d7f4e0" stroke="#293135" stroke-width="1.5"/>
<text x="392.5" y="503.0" text-anchor="middle" font-size="19" fill="#293135" font-weight="400">Sensor C</text>
<path d="M315,497 L230,416" fill="none" stroke="#293135" stroke-width="2" marker-end="url(#arrow)"/>
<text x="250" y="560" text-anchor="middle" font-size="19" fill="#4a5550" font-weight="400">Pilots return through bidirectional REF</text>
<text x="250" y="588" text-anchor="middle" font-size="19" fill="#4a5550" font-weight="400">Remove modeled REF path delays</text>
<rect x="680" y="300" width="140" height="54" rx="4" fill="#d7f4e0" stroke="#293135" stroke-width="1.5"/>
<text x="750.0" y="333.0" text-anchor="middle" font-size="19" fill="#293135" font-weight="400">Sensor A</text>
<rect x="540" y="470" width="140" height="54" rx="4" fill="#d7f4e0" stroke="#293135" stroke-width="1.5"/>
<text x="610.0" y="503.0" text-anchor="middle" font-size="19" fill="#293135" font-weight="400">Sensor B</text>
<rect x="820" y="470" width="140" height="54" rx="4" fill="#d7f4e0" stroke="#293135" stroke-width="1.5"/>
<text x="890.0" y="503.0" text-anchor="middle" font-size="19" fill="#293135" font-weight="400">Sensor C</text>
<path d="M700,364 L640,460" fill="none" stroke="#293135" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M800,364 L860,460" fill="none" stroke="#293135" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M690,497 L810,497" fill="none" stroke="#293135" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="750" y="560" text-anchor="middle" font-size="19" fill="#4a5550" font-weight="400">Pilots exchanged over the air or via REF</text>
<text x="750" y="588" text-anchor="middle" font-size="19" fill="#4a5550" font-weight="400">Reciprocal coupling cancels in the comparison</text>
<path d="M25,613 H975" stroke="#d0d8d4"/>
<text x="500" y="641" text-anchor="middle" font-size="19" fill="#4a5550" font-weight="400">Both methods provide relative RX and TX phase and delay corrections.</text>
</g></svg>
